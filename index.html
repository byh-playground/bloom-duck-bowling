<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
        <meta name="description" content="오리로 대시하고, 공을 굴려 몰려오는 핀을 쓰러뜨리세요." />
        <title>덕 볼링 (Duck Bowling)</title>
        <link rel="icon" type="image/svg+xml" href="assets/duck-mark.svg" />
        <link rel="stylesheet" href="styles/game.css" />
        <link rel="stylesheet" href="styles/front-menu.css" />
        <script type="importmap">
            {
                "imports": {
                    "@bloom-gamekit/boot": "https://cdn.jsdelivr.net/gh/byh-playground/bloom-gamekit@68456934188ff73905d6de0597b8733eec1641eb/boot.js",
                    "@bloom-gamekit/audio": "https://cdn.jsdelivr.net/gh/byh-playground/bloom-gamekit@68456934188ff73905d6de0597b8733eec1641eb/audio.js",
                    "@bloom-gamekit/scenario": "https://cdn.jsdelivr.net/gh/byh-playground/bloom-gamekit@68456934188ff73905d6de0597b8733eec1641eb/scenario.js",
                    "@bloom-gamekit/simloop": "https://cdn.jsdelivr.net/gh/byh-playground/bloom-gamekit@68456934188ff73905d6de0597b8733eec1641eb/simloop.js"
                }
            }
        </script>
    </head>
    <body>
        <main>
            <section id="boot-screen" class="front-screen boot-screen" aria-labelledby="boot-title">
                <div class="boot-card">
                    <img id="boot-mark" src="assets/duck-mark.svg" width="68" height="68" alt="" />
                    <h1 id="boot-title">덕 볼링</h1>
                    <progress id="boot-progress" max="1" aria-label="게임 로딩 진행률"></progress>
                    <p id="boot-status" role="status">게임을 불러오는 중…</p>
                    <a id="boot-retry" class="front-back" href="" hidden>다시 불러오기</a>
                    <small id="product-version" class="product-version" title="게임 버전"
                        >0.3.0</small
                    >
                </div>
            </section>
            <section
                id="home-screen"
                class="front-screen home-screen"
                aria-labelledby="home-title"
                hidden
            >
                <div class="home-hero">
                    <div class="home-art" aria-hidden="true">
                        <img id="home-court" src="assets/duck-hero.svg" alt="" />
                        <canvas id="home-duck" width="640" height="355" aria-hidden="true"></canvas>
                        <canvas
                            id="home-showcase"
                            width="640"
                            height="360"
                            aria-hidden="true"
                            hidden
                        ></canvas>
                    </div>
                    <div class="home-title">
                        <img src="assets/duck-mark.svg" width="36" height="36" alt="" />
                        <h1 id="home-title" tabindex="-1">덕 볼링</h1>
                    </div>
                </div>
                <div class="home-menu">
                    <div class="front-actions">
                        <button type="button" id="play" class="front-primary">
                            <span>플레이</span><span aria-hidden="true">→</span>
                        </button>
                        <button type="button" id="home-settings">
                            <svg
                                width="16"
                                height="16"
                                viewBox="0 0 24 24"
                                fill="none"
                                aria-hidden="true"
                            >
                                <circle
                                    cx="12"
                                    cy="12.1"
                                    r="2.8"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                />
                                <path
                                    d="M9.4 3h5.2l.6 2.5 2.2 1.3 2.5-.7 2.6 4.5-1.8 1.8v2.5l1.8 1.8-2.6 4.5-2.5-.7-2.2 1.3-.6 2.5H9.4l-.6-2.5-2.2-1.3-2.5.7-2.6-4.5 1.8-1.8v-2.5l-1.8-1.8 2.6-4.5 2.5.7 2.2-1.3z"
                                    transform="translate(1.8 .5) scale(.85)"
                                    stroke="currentColor"
                                    stroke-width="2.1"
                                    stroke-linejoin="round"
                                />
                            </svg>
                            설정
                        </button>
                    </div>
                </div>
            </section>
            <section
                id="maps-screen"
                class="front-screen maps-screen"
                aria-labelledby="maps-title"
                hidden
            >
                <header class="front-header">
                    <button type="button" id="maps-back" class="front-back">
                        <span aria-hidden="true">←</span><span>돌아가기</span>
                    </button>
                    <h1 id="maps-title" tabindex="-1">맵 선택</h1>
                    <img src="assets/duck-mark.svg" width="34" height="34" alt="" />
                </header>
                <p id="map-notice" class="map-notice" role="status" hidden></p>
                <label class="map-bowler" id="bowler-picker" hidden>
                    캐릭터
                    <select id="bowler-select"></select>
                </label>
                <div id="map-cards" class="map-cards"></div>
            </section>
            <section id="game-screen" class="game-screen" aria-label="덕 볼링 경기" hidden>
                <header class="duck-header">
                    <h1>덕 볼링</h1>
                    <button
                        id="menu"
                        type="button"
                        aria-label="메뉴"
                        aria-haspopup="dialog"
                        aria-controls="menu-dialog"
                    >
                        <svg
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            fill="none"
                            aria-hidden="true"
                        >
                            <path
                                d="M4 6h16M4 12h16M4 18h16"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                            />
                        </svg>
                    </button>
                </header>
                <section class="round-hud" aria-label="라운드 진행">
                    <div class="round-info">
                        <strong id="round"></strong>
                        <span id="objective"></span>
                    </div>
                    <div id="health" class="health" role="meter" aria-label="체력"></div>
                </section>
                <section class="arena">
                    <canvas
                        id="game"
                        tabindex="0"
                        width="640"
                        height="720"
                        aria-label="덕 볼링 경기장"
                    ></canvas>
                    <div
                        id="overlay"
                        class="popup-actions"
                        role="dialog"
                        aria-labelledby="overlay-title"
                        hidden
                    ></div>
                </section>
                <section class="move-controls" aria-label="대시와 굴리기">
                    <div
                        id="move-stick"
                        role="group"
                        aria-label="왼쪽 대시. 원하는 방향을 길게 누르면 대시가 충전될 때마다 이동합니다. 키보드는 WASD."
                        tabindex="0"
                    >
                        <span class="stick-cross" aria-hidden="true">✥</span>
                        <span class="stick-center" aria-hidden="true"></span>
                        <i class="stick-knob" aria-hidden="true"></i>
                        <div id="dash-charges" class="dash-charges" role="img">
                            <i id="dash-charge-0" class="dash-charge full" aria-hidden="true"></i>
                            <i id="dash-charge-1" class="dash-charge full" aria-hidden="true"></i>
                            <i id="dash-charge-2" class="dash-charge full" aria-hidden="true"></i>
                        </div>
                        <small aria-hidden="true">대시</small>
                    </div>
                    <div class="shot-dock">
                        <div class="queued-shot">
                            <div class="current-ball" role="status" aria-atomic="true">
                                <i id="shot-orb" class="orb" aria-hidden="true" hidden></i>
                                <strong id="shot-kind"></strong>
                                <span id="shot-trait"></span>
                            </div>
                            <span id="ammo" class="ammo">공 <b id="ammo-count"></b></span>
                        </div>
                        <div class="throw-control">
                            <canvas
                                id="throw-pad"
                                width="440"
                                height="256"
                                tabindex="0"
                                aria-label="오른쪽 굴리기 영역"
                            ></canvas>
                        </div>
                    </div>
                </section>
            </section>
            <dialog id="menu-dialog" aria-labelledby="menu-title">
                <div id="menu-panel" class="popup-actions"></div>
            </dialog>
            <template id="game-intro">
                <p>오리로 대시하고, 공을 굴려 몰려오는 핀을 쓰러뜨리세요.</p>
            </template>
            <output id="summary" hidden></output>
        </main>
        <script type="module" src="src/app/main.mjs"></script>
    </body>
</html>
