name: Code Quality

on:
    pull_request:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 3
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm
            - name: Install pinned dev tools
              run: npm ci
            - name: Check changed files
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
              run: node tools/check-changed.mjs
            - name: Verify reusable gameplay scenarios
              run: npm test
