name: Code Quality

on:
    pull_request:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 3
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
            - name: Check content index
              run: node tools/content-index.mjs --check
            - name: Check changed JavaScript syntax
              shell: bash
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
              run: |
                  changed_files=$(mktemp)
                  trap 'rm -f "$changed_files"' EXIT

                  git diff --name-only --diff-filter=ACMR -z "${BASE_SHA:?Missing PR base SHA}...HEAD" -- '*.js' '*.mjs' '*.cjs' > "$changed_files"

                  while IFS= read -r -d '' file; do
                      printf 'Checking syntax: %q\n' "$file"
                      node --check "./$file"
                  done < "$changed_files"
